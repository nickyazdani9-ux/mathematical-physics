name: Financial dynamics offline research

on:
  push:
    paths:
      - 'engineering/financial_dynamics/**'
      - 'research/financial_dynamics/**'
      - 'monitoring/financial_dynamics/**'
      - '.github/workflows/financial-dynamics.yml'
  pull_request:
    paths:
      - 'engineering/financial_dynamics/**'
      - 'research/financial_dynamics/**'
      - 'monitoring/financial_dynamics/**'
      - '.github/workflows/financial-dynamics.yml'

permissions:
  contents: read

jobs:
  offline:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Install numerical dependencies
        run: python -m pip install -r research/financial_dynamics/requirements.txt
      - name: Numerical, accounting and lifecycle checks
        run: python -m unittest discover -s engineering/financial_dynamics/tests -v
      - name: Synthetic experiment suite
        run: python -m engineering.financial_dynamics.experiments run --output runs/ci
      - name: Verify artifacts and generate proposals
        run: python -m engineering.financial_dynamics.experiments analyze --output runs/ci
